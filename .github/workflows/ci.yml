# REA-T2.3 — rr-rea's own verification gate.
#
# WHY. RTL-P2.989 made this repo the SOLE source of shipped REA RTL: the
# routertl vendored builtin, rea_sync.py and the byte-for-byte drift gate that
# transitively gated this tree are all gone. From that commit until this
# workflow, nothing ran the 37-file cocotb suite automatically, ever — a change
# could be committed here, published, resolved by an unpinned ^1.0.0 in every
# example, and reach silicon without a single sim having run. It showed:
# C_REA_VERSION was bumped 0x52454107 -> 0x52454109 and three tests kept the old
# literal, so the suite sat RED for weeks with nobody looking.
#
# The tag path is the one that matters most — publish is the moment the blast
# radius becomes every consumer.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  # RTL-T1.25: keep the sim queue OFF in CI. There is no dispatcher on a
  # runner, so a queue-routed sim would sit queued forever; and a bare
  # `rr sim run` under the knob SUBMITS and exits 0, which is exactly how a
  # gate reports a pass for tests that never ran. Belt AND braces: the knob is
  # pinned off here and every invocation below also passes --wait.
  RR_QUEUE_SIMS: "0"
  # Pinned to the version the suite is developed against on the bench.
  NVC_VERSION: "1.19.3-1"
  NVC_RELEASE: "r1.19.3"

jobs:
  structural:
    name: Structural guards (no simulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run structural guards
        run: python -m pytest tests/ -q

  sims:
    name: cocotb suite (nvc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install nvc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deb="nvc_${NVC_VERSION}_amd64_ubuntu-24.04.deb"
          gh release download "$NVC_RELEASE" --repo nickg/nvc --pattern "$deb"
          sudo apt-get update
          sudo apt-get install -y "./$deb"
          nvc --version

      - name: Install routertl SDK + cocotb
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install routertl cocotb
          rr --version

      - name: Preflight — can this SDK dispatch engine scripts?
        run: |
          set -euo pipefail
          # RTL-T1.26. A PUBLISHED routertl wheel is Cython-compiled, and
          # engine-script dispatch used to resolve scripts by literal .py
          # filename — so on a runner (no source tree on the walk-up path)
          # EVERY dispatch missed: hooks skipped, EMPTY compile order,
          # "make: Nothing to be done for 'sim'", all 39 tests red. Fixed in
          # routertl main; until a release carries it, this job CANNOT pass.
          #
          # Fail here, with the reason, instead of leaving a wall of
          # unexplained test failures below. Self-heals the moment a release
          # ships the fix — no version pin to bump.
          if rr sim run test_rea_dpram 2>&1 | tee /tmp/preflight.log \
             | grep -q "SDK engine script .* not found"; then
            echo "::error title=SDK too old (RTL-T1.26)::The installed routertl \
          ($(rr --version)) cannot dispatch engine scripts from a compiled \
          wheel, so this suite cannot run. Fixed in routertl main; waiting on \
          a release. The pre-push hook (.githooks/pre-push) is the live \
          behavioural gate meanwhile."
            exit 1
          fi
          echo "SDK dispatches engine scripts — proceeding to the full suite."

      - name: Run the full cocotb suite
        run: |
          set -euo pipefail
          # RTL-T1.25 has two halves and CI only needs one of them. The
          # LOAD-BEARING half is `RR_QUEUE_SIMS: "0"` in env: above — with the
          # knob off the run is inline and its exit code is the suite's real
          # verdict (measured: exit 1 on a failing test). `--wait` is the belt
          # to that braces, and it only exists in an SDK newer than the wheel
          # on PyPI, so probe for it instead of hard-failing on `No such
          # option '--wait'` (which is how this workflow failed its first run).
          WAIT=""
          if rr sim run --help 2>&1 | grep -q -- '--wait'; then
            WAIT="--wait"
            echo "SDK supports --wait; using it."
          else
            echo "SDK predates --wait ($(rr --version)); relying on RR_QUEUE_SIMS=0."
          fi
          # No `| tee` here on purpose: a pipeline reports the PIPE's exit
          # status, not the gate's, which silently green-bars a red suite
          # (H.183). If output capture is ever wanted, use PIPESTATUS[0].
          rr sim run --all $WAIT

      - name: Run the pytest-style sim guards
        run: |
          set -euo pipefail
          # pytest-style guards under sim/cocotb/tests (no @cocotb.test): elaboration
          # refusals like the REQ-018 ceiling guard and the REQ-957 storage-qualifier
          # guard. `rr sim run --all` runs only cocotb modules, so without this step
          # they ran in NO gate (found REA-P2.7). Discovered, not listed, so a new
          # guard is covered the day it is added; an empty list is a failure, not a pass.
          mapfile -t _guards < <(grep -L '@cocotb.test' sim/cocotb/tests/test_*.py)
          [ "${#_guards[@]}" -gt 0 ] || { echo "no sim guards found"; exit 1; }
          python -m pytest "${_guards[@]}" -q

      - name: Upload sim logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea-sim-logs
          path: |
            sim/cocotb/logs/
            sim/logs/
          if-no-files-found: ignore
          retention-days: 14
