# rr_rea — Requirements catalog (contract-first per ROUTERTL convention)
#
# Each REA-REQ-N below is referenced by exactly one cocotb test in
# sim/cocotb/tests/rea/test_*.py via @requires(REA-REQ-N). `rr sim coverage-map` enforces
# the mapping.
#
# kind:
#   behavioral — positive contract (this MUST happen)
#   negative   — explicit non-behavior (this MUST NOT happen — used to
#                pin the architectural fixes vs the reference ELA, e.g. REA-REQ-101)

ip: rr_rea_top
version: 0.1
hdl_file: rtl/rr_rea_top.vhd

functional_contract:

  # ── rr_rea_dpram (sample + timestamp BRAM) ────────────────────────
  - id: REA-REQ-200
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Module hierarchy" }]
    desc: >-
      Write/read same address (port A → port B) returns the same value
      on the next clk_b cycle (synchronous read).
  - id: REA-REQ-201
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Module hierarchy" }]
    desc: >-
      Concurrent write on port A and read on port B at DIFFERENT
      addresses do not collide; port B sees previously-written data.
  - id: REA-REQ-202
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Module hierarchy" }]
    desc: >-
      Generic WIDTH and DEPTH parameters drive the actual storage
      shape (verified by writing/reading at addr=DEPTH-1 and
      din=2^WIDTH-1).

  # ── rr_rea_jtag_iface (BSCAN protocol decoder) ────────────────────
  - id: REA-REQ-001
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mocking BSCAN" }]
    desc: >-
      Single register write opcode produces exactly one reg_wr_en
      pulse with reg_addr / reg_wdata carrying the values shifted in
      via tdi.
  - id: REA-REQ-002
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mocking BSCAN" }]
    desc: >-
      Single register read opcode latches the addressed value and
      shifts it out on TDO over the next 32 shift cycles.
  - id: REA-REQ-003
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mocking BSCAN" }]
    desc: >-
      N successive read scans each shift out their addressed reg_rdata
      via tdo without losing or aliasing values — the prerequisite for
      the host's read_block USER1 fallback path.

  # ── rr_rea_regbank (memory-mapped register file) ──────────────────
  - id: REA-REQ-010
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "SW Interface Contract (frozen)" }]
    desc: >-
      Every RW register address round-trips an arbitrary 32-bit value
      (write then read returns the same value).
  - id: REA-REQ-011
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "SW Interface Contract (frozen)" }]
    desc: >-
      STATUS register reflects its input wires (armed, triggered,
      done, overflow) combinationally.
  - id: REA-REQ-012
    kind: negative
    spec: [{ doc: SPEC.md, clause: "SW Interface Contract (frozen)" }]
    desc: >-
      Write to a RO address is a no-op (no aliasing into a RW slot
      at the same low-order bits).
  - id: REA-REQ-013
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Wide trigger value/mask (`G_SAMPLE_W > 32`, RTL-P2.658)" }]
    desc: >-
      Wide trigger value/mask (G_SAMPLE_W > 32) are banked into
      ceil(G_SAMPLE_W/32) 32-bit words paged via TRIG_WORD_SEL (0x2C):
      with sel=k, a write/read of TRIG_VALUE/TRIG_MASK (0x24/0x28)
      targets word k, and the full value drives trig_value_out/
      trig_mask_out. sel resets to 0, so a G_SAMPLE_W<=32 core (or a
      host that never writes TRIG_WORD_SEL) is byte-identical to the
      legacy single-word path (RTL-P2.658).
  - id: REA-REQ-014
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Wide capture readback (`G_SAMPLE_W > 32`, RTL-P1.91)" }]
    desc: >-
      Wide capture data (G_SAMPLE_W > 32) is exposed through the frozen
      one-address-per-cell DATA_BASE window, paged independently by
      DATA_WORD_SEL (0xCC). Selector k returns sample bits
      [32*k+31:32*k], zero-padding a partial final word and returning zero
      for an out-of-range selector. The selector resets to 0, preserving
      byte-identical low-word readback for hosts that never write it.
  - id: REA-REQ-015
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Identity / content fingerprint (`FEATURES` 0xD0, `BUILD_ID` 0xD4, RTL-P3.1198)" }]
    desc: >-
      Identity/content fingerprint registers (RTL-P3.1198). FEATURES (0xD0,
      RO) packs the synth-time generics into a config fingerprint: bits[7:0]
      = G_TRIG_CONDS, bits[15:8] = G_NUM_SOURCE, bit[16] = '1' when
      G_SAMPLE_W > 32, bit[17] = wide-condition decode, and bit[18] = '1'
      when G_TIMESTAMP_W > 0. BUILD_ID (0xD4, RO)
      reads back the G_BUILD_ID generic verbatim (default 0 = not injected).
      Both are read-only: a write must not change them and must not alias
      into a RW slot.
  - id: REA-REQ-019
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "SW Interface Contract (frozen)" }]
    desc: >-
      VERSION (0x00, RO) SHALL read the exact current feature-tier magic
      0x52454109 (v0.9). The value is a protocol discriminator, not an
      inferred string or a mutable register. The tier byte is ODD by
      permanent contract (REA-REQ-806) — the one-read odd-VERSION probe
      is how a wide-readback miscompile is detected (RTL-P1.96).
  - id: REA-REQ-022
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "SW Interface Contract (frozen)" }]
    desc: >-
      CAPTURE_LEN (0x1C, RO) SHALL update combinationally from the current
      PRETRIG and POSTTRIG register values as PRETRIG + POSTTRIG + 1 using
      32-bit unsigned arithmetic; it does not require an arm or completed
      capture before reporting the configured window length.
  - id: REA-REQ-023
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "SW Interface Contract (frozen)" }]
    desc: >-
      TIMESTAMP_W (0xC4, RO) SHALL report the exact G_TIMESTAMP_W synth-time
      generic. In v0.7 FEATURES[18] SHALL be set exactly when TIMESTAMP_W is
      nonzero; zero SHALL elaborate no timestamp storage plane.
  - id: REA-REQ-024
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Timestamp capture plane (RTL-T2.123)" }]
    desc: >-
      When G_TIMESTAMP_W > 0, each stored sample SHALL have a same-address,
      same-write-enable timestamp from a free-running sample-clock counter.
      DATA_PLANE_SEL=1 and DATA_WORD_SEL SHALL expose the full timestamp through
      DATA_BASE. Sample and timestamp readback SHALL remain aligned after the
      same START_PTR rotation across ring wrap and trigger.

  # ── Wide sample-width ceiling + wide conditions (RTL-P2.876/P2.895) ──
  - id: REA-REQ-016
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Wide sample-width ceiling + un-ignorable guard (RTL-P2.876/P2.895)" }]
    desc: >-
      Sample-width ceiling C_MAX_SAMPLE_W is 1024 bits (RTL-P2.876). A probe up
      to the ceiling (e.g. the field's 704-bit build) SHALL elaborate and the
      banked trigger value/mask SHALL page into ceil(G_SAMPLE_W/32) 32-bit words
      via TRIG_WORD_SEL, reassembling into the full-width `trig_value_out` —
      storage sized by the INSTANTIATED width, not the ceiling. The wide-sample
      FEATURES fingerprint stays set for any G_SAMPLE_W>32. Wide sample and
      comparator data/config registers SHALL be excluded from the asynchronous
      sample reset tree and qualified by resettable valid/enable control state,
      so reset-recovery fanout does not scale with G_SAMPLE_W (RTL-P2.897).
  - id: REA-REQ-017
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Wide comparator conditions — `field_lsb ≥ 256` (RTL-P2.876)" }]
    desc: >-
      Wide comparator conditions (RTL-P2.876). COND_CFG carries an 11-bit
      field_lsb {lsb_hi[30:28], lsb_lo[15:8]} (0..2047) so a per-condition
      comparator field can sit above bit 255. The regbank SHALL expand a slot
      with field_lsb>=256 into a full-width `cond_masks_out`/`cond_values_out`
      shifted to that offset, and the capture FSM SHALL assert `triggered` on a
      masked-field match at that high offset. The wide_cond FEATURES bit SHALL be
      '1' exactly when G_SAMPLE_W>256, advertising the extended decode; a
      field_lsb<256 stays byte-identical (lsb_hi=0).
  - id: REA-REQ-018
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Wide sample-width ceiling + un-ignorable guard (RTL-P2.876/P2.895)" }]
    desc: >-
      Un-ignorable over-ceiling guard (RTL-P2.895). A G_SAMPLE_W > C_MAX_SAMPLE_W
      instantiation SHALL fail ELABORATION in every tool via a static range
      violation (a `natural range 0 to 0` constant assigned boolean'pos of the
      over-ceiling test), not merely a runtime `assert severity failure` that
      vendor synthesis downgrades to a warning (the mechanism that shipped
      undefined out-of-ceiling silicon). The friendly assert also remains for a
      readable message. In-ceiling widths SHALL elaborate cleanly.

  # ── rr_rea_cdc (clock-domain crossings) ───────────────────────────
  - id: REA-REQ-020
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Module hierarchy" }]
    desc: >-
      Slow-changing config word toggled mid-cycle on the source clock
      settles on the destination clock within ≤2 dest-clock cycles
      with no metastable glitch.
  - id: REA-REQ-021
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Module hierarchy" }]
    desc: >-
      Toggle-pulse-encoded src_pulse event of N src_clk cycles produces
      exactly one dst_pulse on dst_clk.

  # ── rr_rea_capture_fsm (the heart) ────────────────────────────────
  - id: REA-REQ-100
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      wr_ptr advances every sample_clk cycle from reset deassertion,
      with armed=0. Sliding-window contract.
  - id: REA-REQ-101
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      arm_pulse does NOT reset wr_ptr; the buffer's pre-arm context
      is preserved across arm. Pins the architectural fix vs the reference ELA.
  - id: REA-REQ-102
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      When triggered asserts, trig_ptr_out captures wr_ptr_out at
      that same cycle (no off-by-N).
  - id: REA-REQ-103
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      dpram_addr at the cycle dpram_we is high carries the trigger
      sample value (probe_in & trig_mask) == (trig_value & trig_mask).
  - id: REA-REQ-104
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      When done asserts, start_ptr_out == (trig_ptr_out - pretrig)
      mod DEPTH.
  - id: REA-REQ-105
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      Reading DEPTH samples (snooped via dpram_we / dpram_addr /
      dpram_din) starting at start_ptr_out yields a time-monotonic
      sequence with no gaps.
  - id: REA-REQ-106
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      When the design has been running ≥ DEPTH cycles before arm,
      the captured window contains zero uninit-BRAM cells (no
      phantom zeros).
  - id: REA-REQ-107
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      On arm_pulse, overflow SHALL assert exactly when PRETRIG + POSTTRIG is
      greater than or equal to DEPTH (the requested window cannot fit), and
      SHALL clear for a subsequent legal arm or reset_pulse. STATUS[3] mirrors
      this generated FSM flag through the sample-to-JTAG CDC.
  - id: REA-REQ-108
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      While armed and not yet triggered, the trigger condition SHALL be
      evaluated on EVERY stored sample, not only at or near arm_pulse. A
      condition that is FALSE at arm and becomes true later — the whole reason
      a pre-trigger window exists — SHALL fire the capture, including when the
      condition is a probe bit driven by a host SOURCE write during the armed
      window, and regardless of whether any JTAG traffic occurs while armed.
      Until the capture fires it SHALL remain untriggered for the entire
      interval the condition is false. RTL-T2.220: REA-REQ-100..107 pin the
      sliding window and the pointer arithmetic — the output mapping — so a
      core that only sampled the condition at arm satisfied every one of them,
      and the shipped rea_source_demo documented a pre-trigger scenario that
      nothing had ever shown the hardware perform.

  # ── rr_rea_capture_fsm (cross-domain trigger, v0.2) ───────────────
  - id: REA-REQ-400
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "v0.2 — Cross-domain trigger crossbar (rr_rea_trig_xbar)" }]
    desc: >-
      An external trigger_in pulse on sample_clk fires the capture
      exactly like a local trigger_hit — triggered_r asserts and
      trig_ptr_r captures wr_ptr_r at the same cycle.
  - id: REA-REQ-401
    kind: negative
    spec: [{ doc: SPEC.md, clause: "v0.2 — Cross-domain trigger crossbar (rr_rea_trig_xbar)" }]
    desc: >-
      An external trigger_in pulse must NOT drive trigger_out_r
      (otherwise N coupled REA cores ping-pong forever). Only a
      local trigger_hit drives trigger_out_r.

  # ── External board-pin trigger (RTL-P3.266) ───────────────────────
  # Distinct from the trig_xbar trigger_in pulse above (REA-REQ-400/401):
  # ext_trigger_in is a package-pin input (synced in rr_rea_top) the user
  # routes from a board pin, gated by TRIG_MODE ext_en[3]/ext_and[8].
  - id: REA-REQ-410
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "External board-pin trigger (`TRIG_MODE` bit[3]/bit[8], RTL-P3.266)" }]
    desc: >-
      With TRIG_MODE ext_en[3]=1 and ext_and[8]=0 (OR mode), raising
      ext_trigger_in alone fires the capture even when the internal
      comparator never matches — fire on (internal hit) OR (ext pin).
  - id: REA-REQ-411
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "External board-pin trigger (`TRIG_MODE` bit[3]/bit[8], RTL-P3.266)" }]
    desc: >-
      With ext_en[3]=1 and ext_and[8]=1 (AND mode), a permanently-true
      internal comparator must NOT fire while ext_trigger_in is low, and
      MUST fire once the pin rises — fire only on (internal hit) AND (pin).
  - id: REA-REQ-412
    kind: negative
    spec: [{ doc: SPEC.md, clause: "External board-pin trigger (`TRIG_MODE` bit[3]/bit[8], RTL-P3.266)" }]
    desc: >-
      With ext_en[3]=0 the ext_trigger_in pin is ignored entirely — a
      pin held high must not fire the capture (the internal-only path is
      unchanged when the feature is off; back-compat).
  - id: REA-REQ-413
    kind: negative
    spec: [{ doc: SPEC.md, clause: "External board-pin trigger (`TRIG_MODE` bit[3]/bit[8], RTL-P3.266)" }]
    desc: >-
      In AND mode, `trigger_out` (the trig_xbar drive) pulses only on the
      true local fire (comparator AND ext_trigger_in both held) — never on
      the comparator alone, which by itself does not fire (no premature
      ping-pong of coupled cores).

  # ── rr_rea_trig_xbar (cross-domain crossbar, v0.2) ────────────────
  - id: REA-REQ-402
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "v0.2 — Cross-domain trigger crossbar (rr_rea_trig_xbar)" }]
    desc: >-
      A toggle on toggle_a_in produces exactly one pulse_b_out on
      clk_b within ≤4 dst-clock cycles, and vice versa for the
      reverse direction (toggle_b_in → pulse_a_out).

  # ── rr_rea_capture_fsm (decimation, v0.3) ─────────────────────────
  - id: REA-REQ-500
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Out of scope (parked)" }]
    desc: >-
      With decim_ratio_in=0, dpram_we fires every cycle (matches
      v0.1/v0.2 — no decimation). Sliding-window contract intact.
  - id: REA-REQ-501
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Out of scope (parked)" }]
    desc: >-
      With decim_ratio_in=N (N>0), dpram_we asserts on exactly one
      cycle per (N+1) sample-clock cycles. wr_ptr advances on each
      asserted cycle. post_count counts STORED samples (so the
      post-trigger window is posttrig_len_in stored cells regardless
      of decimation).

  # ── rr_rea_capture_fsm (comparator op modes, RTL-P3.644/645/646) ──
  # Single-comparator (legacy) path gains an op nibble in TRIG_MODE[7:4].
  # op=0 (EQ) is the historical masked-equality behaviour (no regression).
  - id: REA-REQ-610
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mixed-op AND comparator array (`TRIG_MODE` bit[2], RTL-P3.647)" }]
    desc: >-
      With trig_mode_in op=RISE (0x4), `triggered` fires on the cycle a
      masked probe_in bit transitions 0->1 relative to the previous sample
      (any bit under trig_mask_in). It does NOT fire on a steady-high
      probe held across cycles (only the transition edge fires).
  - id: REA-REQ-611
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mixed-op AND comparator array (`TRIG_MODE` bit[2], RTL-P3.647)" }]
    desc: >-
      With trig_mode_in op=FALL (0x5), `triggered` fires on a masked
      probe_in bit transitioning 1->0. It does NOT fire on a rising edge
      nor on a steady-low probe.
  - id: REA-REQ-620
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mixed-op AND comparator array (`TRIG_MODE` bit[2], RTL-P3.647)" }]
    desc: >-
      With trig_mode_in op=LT (0x2), `triggered` fires when the masked
      probe_in (unsigned) is strictly less than the masked trig_value_in.
      It does NOT fire on equality nor on greater-than.
  - id: REA-REQ-621
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mixed-op AND comparator array (`TRIG_MODE` bit[2], RTL-P3.647)" }]
    desc: >-
      With trig_mode_in op=GT (0x3), `triggered` fires when the masked
      probe_in (unsigned) is strictly greater than the masked trig_value_in.
      It does NOT fire on equality nor on less-than.
  - id: REA-REQ-630
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mixed-op AND comparator array (`TRIG_MODE` bit[2], RTL-P3.647)" }]
    desc: >-
      With trig_mode_in op=NE (0x1), `triggered` fires when the masked
      probe_in differs from the masked trig_value_in in ANY bit (multi-bit
      inequality). It does NOT fire when the masked fields are equal.

  # ── rr_rea_trig_seq (multi-stage sequencer, v0.3) ─────────────────
  - id: REA-REQ-600
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Out of scope (parked)" }]
    desc: >-
      With seq_enable_in=0 (default), the FSM honors the legacy
      trig_value_in / trig_mask_in comparator: a matching probe_in
      drives triggered identically to v0.1/v0.2 behavior.
      No regression on REA-REQ-100..106.
  - id: REA-REQ-601
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Out of scope (parked)" }]
    desc: >-
      With G_TRIG_STAGES=N and seq_enable=1, seq_state advances
      from K to K+1 only when stage K's local comparator (using
      seq_value_k, seq_mask_k, seq_mode_k against probe_in)
      matches. seq_state never advances on a stage-K+1 match
      while seq_state == K.
  - id: REA-REQ-602
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Out of scope (parked)" }]
    desc: >-
      The FINAL stage's local comparator match drives both
      triggered and trigger_out at the match cycle, then the
      post-trigger countdown runs unchanged.
  - id: REA-REQ-603
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Out of scope (parked)" }]
    desc: >-
      Each stage's seq_count_target_k, when non-zero, requires
      that many cumulative matches before advancing. seq_counter_k
      tracks the matches and resets when seq_state advances past
      stage K (or on arm_pulse).
  - id: REA-REQ-604
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Out of scope (parked)" }]
    desc: >-
      A non-final-stage match must NOT drive triggered or
      trigger_out. Only the final stage's match drives the
      capture trigger.
  - id: REA-REQ-605
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Out of scope (parked)" }]
    desc: >-
      An out-of-order probe_in pattern that matches a later
      stage's value while we're still on an earlier stage must
      NOT fire triggered. Only an in-order traversal advances
      the sequencer to the final stage.
  - id: REA-REQ-606
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Out of scope (parked)" }]
    desc: >-
      arm_pulse resets seq_state to 0 and clears all seq_counter_k
      registers. A new arm cycle restarts the sequence from
      stage 0 regardless of where the previous capture left it.
  - id: REA-REQ-607
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "SW Interface Contract (frozen)" }]
    desc: >-
      Per-stage config maps at ADDR_SEQ_BASE = 0x0040 with stride
      20 bytes. wr_addr / wr_data writes to the SEQ_BASE address
      window must NOT alias into the v0.1/v0.2 RW slots
      (PRETRIG / POSTTRIG / TRIG_VALUE / TRIG_MASK / CHAN_SEL /
      DECIM); rd_addr at PRETRIG returns its written value
      regardless of intervening SEQ_BASE writes.
  - id: REA-REQ-608
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mixed-op AND comparator array (`TRIG_MODE` bit[2], RTL-P3.647)" }]
    desc: >-
      Per-condition comparator array (mixed-op AND, RTL-P3.647). When
      array_enable_in is set, the capture FSM ANDs every VALID condition
      slot: slot k applies its own op through cond_ops_in / cond_ops_out
      to its masked field (probe_in and cond_masks_in / cond_masks_out) vs
      cond_values_in / cond_values_out. `triggered` fires only when ALL
      valid slots match; an invalid slot does not block; an all-invalid
      array never fires (no free-fire on arm). array_enable_in=0 leaves
      the legacy single-comparator path unchanged; seq_enable takes
      precedence over array_enable_in.

  # ── Write-side SOURCE (ISSP-style, RTL-P2.837) ────────────────────
  # JTAG-writable control bit(s) driven INTO the design — the counterpart
  # to the read-only probe path. SOURCE register (0x3C) → low G_NUM_SOURCE
  # bits → rr_rea_sync_word (jtag_clk → sample_clk) → rr_rea_top.source_out.
  - id: REA-REQ-700
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Write-side source (`SOURCE` 0x3C, RTL-P2.837)" }]
    desc: >-
      source_out resets to all-zeros (every gated DUT signal held
      SAFE/inactive) and STAYS zero across a full trigger-config load, an
      arm pulse, and a reset pulse — nothing but an explicit SOURCE-register
      write releases it. Pins the no-auto-release contract: the gate must
      start closed so the operator can arm REA before releasing the DUT.
  - id: REA-REQ-701
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Write-side source (`SOURCE` 0x3C, RTL-P2.837)" }]
    desc: >-
      A JTAG write to SOURCE (0x3C) drives the low G_NUM_SOURCE bits onto
      source_out in the sample_clk domain within a few sample-clocks, having
      crossed jtag_clk → sample_clk through rr_rea_sync_word (two-flop
      ASYNC_REG sync); a clearing write re-gates it, and the register
      round-trips on JTAG readback (release → re-gate → full-width release).
  - id: REA-REQ-702
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Write-side source (`SOURCE` 0x3C, RTL-P2.837)" }]
    desc: >-
      Only the low G_NUM_SOURCE bits of the SOURCE register reach source_out.
      Bits above G_NUM_SOURCE are stored (round-trip on readback) but MUST
      NOT drive the port — the port width is the contract, guarding against a
      wide-slice bug leaking phantom control bits into the design.

  # ── rr_rea_top (integration) ──────────────────────────────────────
  - id: REA-REQ-300
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Mocking BSCAN" }]
    desc: >-
      Full end-to-end with mocked BSCAN — driving tdi / capture /
      shift_en / update / sel through the configure → arm → wait
      done → read sequence the reference host uses, the dpram readback
      via tdo matches a known sample-clock counter pattern.
  - id: REA-REQ-301
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      rr_rea_top SHALL NOT expose G_INPUT_PIPE_STAGES. A one-cycle `probe_in`
      trigger value MUST NOT bypass the internally-derived comparator stages;
      `triggered` SHALL assert only after the derived latency.
  - id: REA-REQ-302
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      rr_rea_capture_fsm SHALL NOT expose G_TRIGGER_PIPE_STAGES. A derived
      local fire SHALL preserve `trig_ptr_out` and pulse `trigger_out` once;
      an independent `trigger_in` pulse remains immediate and MUST NOT drive
      `trigger_out`.
  - id: REA-REQ-303
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Wide capture readback (`G_SAMPLE_W > 32`, RTL-P1.91)" }]
    desc: >-
      For every legal G_SAMPLE_W, the host SHALL reconstruct each captured
      sample exactly by reading DATA_BASE once per DATA_WORD_SEL bank in
      little-endian word order, masking unused bits in the partial final
      word, then restoring DATA_WORD_SEL to 0. G_SAMPLE_W<=32 SHALL perform
      the historical single read per cell without accessing the selector.

  # ── rr_rea trigger-pipeline decomposition (v0.6, RTL-P3.1165) ─────
  - id: REA-REQ-320
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      The local comparator pipeline stage count SHALL be internally derived,
      never supplied by a user-facing depth generic. C_SLICE_W is a FIXED
      internal constant (C_SLICE_W=8), not a generic: the compare/reduce
      structure (slice count, carry-chain depth, reduction fan-in) is
      generated against it, so exposing it would only spawn dead if-generate
      branches for a decision made at design time. With
      C_WIDTH_STAGES=ceil(G_SAMPLE_W/C_SLICE_W),
      C_REDUCE_STAGES=ceil_log2(G_TRIG_CONDS), and
      N=C_WIDTH_STAGES+C_REDUCE_STAGES. N is at least one. The implementation
      SHALL use exactly N registered compare/reduce stages for a local
      trigger decision and its sample tag. G_TRIG_STAGES does not contribute
      reduction depth: sequencer stages are an ordered state dependency, not
      a simultaneously-reduced fan-in. `triggered` exposes the resulting
      decision latency and `trig_ptr_out` exposes the accompanying tag.
  - id: REA-REQ-321
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      Each of the N local-comparator stages SHALL perform comparator-tree
      decomposition, not a decision-only shift: a stage compares or carries
      forward at most C_SLICE_W (=8) masked probe bits per field and registers
      its partial result; each condition aggregation level is a registered
      binary reduction. When the width tree is shallower than C_WIDTH_STAGES,
      only the narrow root token, edge result, sample tag, and validity state
      SHALL be aligned through the remaining stages; full-width
      current/previous operands SHALL NOT be retained per width stage.
      Post-synthesis netlist plus STA review
      SHALL demonstrate that every register-to-register trigger-decision-cone
      path crosses no more than one C_SLICE_W-wide field comparison and one
      binary reduction level. Arbitrary output-only delay stages fail this
      requirement; registered transport of later slice operands and alignment
      of non-array modes across condition-reduction stages are permitted
      because every derived stage performs compare/reduce work in an active
      trigger mode. `triggered` is the observable end of this decision cone.
  - id: REA-REQ-322
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      For every derived N, when the local comparator accepts sample S,
      trig_ptr_out and DPRAM readback SHALL identify S, irrespective of the
      later cycle on which the pipelined decision is reported. The tag that
      accompanies every partial result SHALL be the write pointer associated
      with S, preserving REA-REQ-102 and REA-REQ-103.
  - id: REA-REQ-323
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      G_INPUT_PIPE_STAGES and G_TRIGGER_PIPE_STAGES SHALL be removed from
      the user-facing rr_rea_top and rr_rea_capture_fsm generic interfaces.
      The narrowest configuration (G_SAMPLE_W<=C_SLICE_W, G_TRIG_CONDS=1,
      sequencer disabled) derives N=1 and matches today's zero-to-one-stage
      behaviour exactly; for every wider derived N the design SHALL preserve
      the current captured-window semantics with no functional regression
      against REA-REQ-100..106 and REA-REQ-300..302, the added report latency
      (N>1) being invisible to the capture result by REA-REQ-322 and
      REA-REQ-325. `triggered` SHALL preserve the one-stage narrow behavior.
  - id: REA-REQ-324
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      No user-facing pipeline-depth generic SHALL remain. The existing scalar
      ext_trigger_in board-pin input and trigger_in crossbar pulse SHALL NOT
      alter N or the internal comparator decomposition. Their external-trigger
      behaviour remains subject to REA-REQ-400, REA-REQ-401, and
      REA-REQ-410..413; adding a multi-input external-trigger interface is a
      separate API/CDC contract, not part of internal comparator pipelining.
  - id: REA-REQ-325
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      Increasing N through G_SAMPLE_W or G_TRIG_CONDS SHALL
      NOT change which sampled probe value satisfies a local trigger condition;
      it may change only the cycle on which the decision is reported. It SHALL
      NOT introduce a trigger-sample offset in trig_ptr_out or DPRAM readback.

  # ── trigger-pipeline decomposition — per-slice token + sequencer (RTL-P3.1167) ──
  # Locks the two algorithm decisions the RTL author needs (design-doc open
  # questions 1 & 3): how EVERY op decomposes across width-slices, and how the
  # sequencer runs when comparator results are pipeline-delayed.
  - id: REA-REQ-326
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      The width-slice decomposition SHALL carry a UNIFORM per-slice comparison
      token so every comparator op decomposes through the same registered
      reduction tree, not just equality. Each C_SLICE_W-wide masked field-slice
      emits a lexicographic 3-state token {eq, gt, lt}; two nodes combine
      ASSOCIATIVELY as eq = eq_hi and eq_lo; gt = gt_hi or (eq_hi and gt_lo);
      lt = lt_hi or (eq_hi and lt_lo) — a monoid, hence a registered radix-4
      width tree (two balanced binary levels per stage) followed by narrow
      result alignment to exactly C_WIDTH_STAGES. At the root EQ=eq, NE=not eq,
      GT=gt, LT=lt
      (masked-unsigned, matching REA-REQ-610/611/620/621/630). RISE/FALL ride
      alongside as a per-slice edge bit (masked cur and not prev for RISE; masked
      prev and not cur for FALL, from a registered previous sample) reduced by
      OR. Each registered tree stage crosses at most one C_SLICE_W-wide slice
      comparison and two combine levels; the separate condition tree crosses one
      binary reduction level per stage (REA-REQ-321), with `triggered` exposing
      the final token decision.
  - id: REA-REQ-327
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Capture FSM contract (the core fix)" }]
    desc: >-
      ALL local comparator paths — the legacy single comparator, the
      G_TRIG_CONDS array, and EACH sequencer stage's local comparator — SHALL be
      decomposed through the SAME N-stage pipeline, so matches emerge in the same
      sample order they entered, delayed by a uniform N, each carrying its
      sample's wr_ptr tag (REA-REQ-322). The sequencer FSM (seq_state advance,
      per-stage seq_count_target, arm reset — REA-REQ-601..606) SHALL run on this
      order-preserved, delayed match stream: a later sample's match MUST NOT
      advance or fire a stage before an earlier sample's result is consumed.
      Because the pipeline only adds uniform latency (never reordering), the
      captured window, the selected sample and the pointer tag are identical to
      the combinational design (REA-REQ-325); only the `triggered` report cycle
      moves.

  # ── v0.8 Trust Tier — readback integrity (REA-P2.1..3, REA-P3.1) ──
  # Contract-first per docs/FDD_REA_TRUST_TIER_V08.md rev2.
  #
  # REA-P3.1 reconciliation (2026-07-24): the forward-contract names the FDD
  # assumed (crc_valid, dpram_we, sweep_rd_en, ts_dpram_we, capture_epoch) were
  # NOT the names the shipped v0.8 RTL used. The formal: blocks below now
  # reference the REAL nets in their NATIVE clock domain, each carrying an
  # explicit `clock:`:
  #   sample_clk_i : fill_we, fill_busy, dpram_we_sclk, sweep_busy,
  #                  sweep_owns_a (sweep read grant; crc_sweep mem_rd_en_o is
  #                  `open`), capture_epoch_r, pub_pending_r, pub_done_r,
  #                  invalidate_toggle_r, arm_pulse_sclk, reset_pulse_sclk,
  #                  g_timestamp_plane.ts_we_a
  #   reg_clk_o    : crc_valid_jr, publish_pulse_jclk, invalidate_pulse_jclk
  # crc_valid is reg-domain (`crc_valid_jr`), so REA-REQ-800/803/811 are
  # cross-CDC and are split into a single-clock sample-domain KERNEL (the
  # formal: psl) + a reg-domain ENDPOINT (documented in prose on each block);
  # their full cross-CDC behaviour stays covered by the bound cocotb tests.
  # REA-REQ-810/854 are clean single-sample-clock properties.
  #
  # NOT YET PROVEN: rr formal --contract cannot build this multi-clock top
  # (reg_clk_o is derived inside the BSCAN wrapper) — tracked RTL-P3.1406. A
  # hand-rolled multiclock + clk2fflogic + memory_nordff sby builds and solves;
  # sound proofs additionally need a reset/reachability assumption. Every
  # property remains subject to the rr-formal ANTI-VACUITY GATE: each must be
  # shown to yield a COUNTEREXAMPLE when tightened before its PASS counts — a
  # vacuous green on a trust feature is the exact failure mode this tier exists
  # to kill.
  - id: REA-REQ-800
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.1 Sweep engine (new logic, `sample_clk` domain)" }]
    desc: >-
      The CRC sweep auto-runs on the rising edge of done (and on selftest
      fill completion) with no host action; crc_valid asserts only after
      BOTH plane results are published atomically (never between planes).
    formal:
      clock: rising_edge(sample_clk_i)
      # REA-P3.2 (PROVEN sample-plane kernel). The earlier `pub_pending -> not
      # sweep_busy` form is NOT a design invariant: the trust tier deliberately
      # PIPELINES back-to-back fills, so a later generation's sweep can run while
      # a prior publication sits in its settle window (formal CEX, BMC depth 90).
      # The SOUND, PROVEN kernel is that a publication is pending only while the
      # SAMPLE plane sweep has completed (sample_done). The ts plane is external
      # to the extracted core (ts_done is a free input / assume-guarantee
      # boundary). Proven BMC-exhaustive (depth 90) on rr_rea_trust_core, with
      # pub_pending REACHED at step ~31 (anti-vacuity gated). The two-generation
      # torn-publish question the pipeline raises is tracked by REA-T2.2 and
      # governed by REQ-808. Full cross-CDC behaviour covered by the cocotb test.
      psl: "always (pub_pending_r = '1' -> sample_done_r = '1')"
  - id: REA-REQ-801
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.4 Contract: canonical page-stream serialization" }]
    desc: >-
      CRC_SAMPLE (0xE4) equals the hard-coded golden CRC-32 (reflected poly
      0xEDB88320, init 0xFFFFFFFF, final XOR 0xFFFFFFFF) of the canonical
      page stream: plane 0, cells in physical order 0..DEPTH-1, pages in
      DATA_WORD_SEL order, each page serialized LSByte-first, including the
      zero-padded partial tail page. Golden values hard-coded per
      ROUTERTL-002 (host reference = zlib.crc32 over the raw '<u4' pages).
  - id: REA-REQ-802
    kind: negative
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.1 Sweep engine (new logic, `sample_clk` domain)" }]
    desc: >-
      A sweep in progress MUST NOT perturb concurrent port-B JTAG readback:
      interleaving DATA_BASE reads with an active sweep returns exactly the
      same values as reading after the sweep completes (port A ownership
      never touches port B).
  - id: REA-REQ-803
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.1 Sweep engine (new logic, `sample_clk` domain)" }]
    desc: >-
      arm_pulse or soft reset during a sweep or a fill ABORTS it, clears
      crc_valid, and increments CAPTURE_EPOCH — before any subsequent
      port-A write can become externally observable.
    formal:
      clock: rising_edge(sample_clk_i)
      # REA-P3.2 + REA-T2.2 (PROVEN UNBOUNDED, k-induction). The invalidate
      # toggle (which clears crc_valid_jr on the reg side) flips ONLY on an arm /
      # soft-reset / accepted-fill pulse. REA-T2.2: a fill IS a new generation
      # (it bumps CAPTURE_EPOCH and overwrites the buffer), so it MUST clear a
      # prior crc_valid — leaving it high while the fill rewrites the buffer is a
      # stale/torn valid. VACUITY NOTE: the `next(toggle)=toggle` form is
      # VACUOUS in ghdl PSL (parses as next(toggle=toggle)=next(true)); the sound
      # proof splits by value with next-to-CONSTANT — see
      # verif/rr_rea_trust_core_formal.psl (REQ803_INVALIDATE_HELD_0/1) + the
      # COVER_INVAL_FLIP_VIA_FILL non-vacuity gate. Reg-domain ENDPOINT: on
      # reg_clk_o invalidate_pulse_jclk='1' forces crc_valid_jr='0' next cycle.
      psl: >-
        always ( (arm_pulse_sclk = '0' and reset_pulse_sclk = '0'
                  and fill_accept = '0' and invalidate_toggle_r = '0')
                 -> next(invalidate_toggle_r) = '0' )
  - id: REA-REQ-804
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.1 Sweep engine (new logic, `sample_clk` domain)" }]
    desc: >-
      When G_TIMESTAMP_W > 0, CRC_TS (0xE8) equals the golden CRC-32 of the
      plane-1 page stream with an INDEPENDENT init (never continuing plane
      0's state), pages sized ceil(G_TIMESTAMP_W/32). G_TIMESTAMP_W=0 reads
      CRC_TS as 0 and elaborates no plane-1 sweep.
  - id: REA-REQ-805
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.4 Contract: canonical page-stream serialization" }]
    desc: >-
      Wide-sample CRC: the swept page values are bit-identical to what the
      DATA_BASE/DATA_WORD_SEL window returns for every (cell, page),
      including zero-padding of the final partial word. Goldens pinned at
      G_SAMPLE_W = 33, 64, and 704 (the field's real operating point).
  - id: REA-REQ-806
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.3 Register map additions (v0.8)" }]
    desc: >-
      FEATURES[19] (readback_integrity) is derived from the same elaboration
      constant (C_HAS_READBACK_INTEGRITY) whose generate produces the sweep
      logic — never hand-set — preserving the generic-derived fingerprint
      invariant. VERSION reads the v0.8 magic 0x52454109; the tier byte is
      ODD (structural test: VERSION bit0 = 1, permanent contract for the
      odd-VERSION acceptance probe).
  - id: REA-REQ-807
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.3 Register map additions (v0.8)" }]
    desc: >-
      CAPTURE_EPOCH (0xEC) increments on every accepted arm, accepted
      selftest fill, soft reset, and sweep/fill abort — and on NOTHING else
      (a completed sweep, a JTAG read, or a refused fill do not change it).
      The host's anti-tear anchor: epoch equality across a window read plus
      crc_valid proves the buffer and CRC belong to one generation.
    formal:
      clock: rising_edge(sample_clk_i)
      # REA-P3.2 (PROVEN UNBOUNDED, k-induction). CAPTURE_EPOCH changes ONLY on
      # an arm / soft-reset / accepted-fill pulse. VACUITY NOTE: `next(epoch)=
      # epoch` is VACUOUS in ghdl PSL (→ next(true)); the sound proof uses the
      # prev() value form with a leading next() to skip cycle 0 (prev()
      # unconstrained at reset) — see verif/rr_rea_trust_core_formal.psl
      # (REQ807_EPOCH_SOURCE). Anti-vacuity gated (fill_accept + epoch-moved
      # covers reachable).
      psl: >-
        next ( always (
          (capture_epoch_r = prev(capture_epoch_r))
          or prev(arm_pulse_sclk = '1' or reset_pulse_sclk = '1'
                  or fill_accept = '1') ) )
  - id: REA-REQ-808
    kind: negative
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.5 CDC — snapshot-and-toggle publication (one new, small structure)" }]
    desc: >-
      Torn publication is impossible: crc_valid is NEVER observable on the
      JTAG side while any CRC register bit still carries a pre-latch value.
      Publication latches both results + epoch, waits a >=8-sample-clk
      settle, then flips the publish toggle; an invalidation (arm / fill /
      reset) racing an in-flight publish always wins (the publish is
      suppressed, crc_valid stays low).
  - id: REA-REQ-810
    kind: negative
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.1 Sweep engine (new logic, `sample_clk` domain)" }]
    desc: >-
      Port-A single-owner arbiter: at most one of {capture write (dpram_we),
      selftest fill write (fill_we), sweep read (sweep_rd_en)} is active on
      any sample_clk cycle, under the fixed priority reset > arm > accepted
      fill > capture > sweep. Formal-first requirement: the mutual-exclusion
      invariants are proven exhaustively, the priority order by directed sim.
    formal:
      clock: rising_edge(sample_clk_i)
      # REA-P3.2 (REA-T2.1 reformulation, PROVEN). The raw-signal form was
      # unsound (T2.1: dpram_we_sclk is the free-running capture write). The
      # SOUND, PROVEN substance is fill/sweep port-A single-ownership: the fill
      # and the sweep never both own port A, and a sweep read never coincides
      # with a port-A write. Proven BMC-exhaustive (depth 90) on the extracted
      # rr_rea_trust_core with free control inputs under the capture-FSM
      # assume-guarantee (verif/rr_rea_trust_core_bmc.{psl,sby}), anti-vacuity
      # gated (verif/rr_rea_trust_core_vacuity.sby). The proof SURFACED and drove
      # fixes for two real port-A contention defects: REA-T1.3 (arm/reset now
      # ABORTS an in-flight fill) and REA-T1.4 (the fill refuse now covers the
      # sweep-START boundary, not just sweep_busy which lags one cycle).
      psl: >-
        always ( (not (fill_busy = '1' and sweep_owns_a = '1'))
                 and (sweep_owns_a = '1' -> dpram_we_a = '0') )
  - id: REA-REQ-811
    kind: negative
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.3 Register map additions (v0.8)" }]
    desc: >-
      Any port-A write outside the sweep engine's own sweep (a capture write
      or a fill write) implies crc_valid is already clear on that cycle — a
      stale CRC can never coexist with a mutating buffer.
    formal:
      clock: rising_edge(sample_clk_i)
      # REA-P3.2 (REA-T2.1-style reformulation, PROVEN). The raw dpram_we_sclk is
      # free-running (the same T2.1 lesson as REQ-810), so the sound property is
      # over the EFFECTIVE (arbitrated) capture write: dpram_we_a='1' with the
      # fill NOT owning the port (the arbiter forces we=0 under sweep/selftest).
      # An effective capture write implies capture is running (done='0' by A1)
      # and not-selftest, so a prior generation cannot still be published
      # (pub_done='0'). Proven BMC-exhaustive (depth 90) on rr_rea_trust_core
      # (verif/rr_rea_trust_core_bmc.{psl,sby}), anti-vacuity gated.
      psl: >-
        always ( (dpram_we_a = '1' and fill_busy = '0') -> pub_done_r = '0' )
  - id: REA-REQ-850
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.2 Selftest pattern mode (BIST)" }]
    desc: >-
      An accepted fill writes the exact specified LFSR sequence: 32-bit
      maximal Fibonacci LFSR, taps 32,22,2,1 (b = x[31] xor x[21] xor x[1]
      xor x[0]; x_next = (x >> 1) | (b << 31)); the PRE-step state is the
      emitted word (seed = word 0); order cell-major then page-minor; unused
      high bits of a cell's final partial page zeroed after generation.
      Hard-coded golden prefix per ROUTERTL-002.
  - id: REA-REQ-851
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.2 Selftest pattern mode (BIST)" }]
    desc: >-
      SELFTEST_SEED is sampled ATOMICALLY at fill acceptance (a seed write
      after acceptance has no effect on the in-flight fill); seed 0 is
      substituted with 0x52454108 (LFSR lockup guard).
  - id: REA-REQ-852
    kind: negative
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.2 Selftest pattern mode (BIST)" }]
    desc: >-
      A fill toggle while armed, while a fill is active, mid-capture, OR while a
      CRC sweep is active (REA-T1.2) is REFUSED (not queued): no port-A write
      occurs, the sticky selftest_refused STATUS bit sets (cleared on the next
      accepted fill, arm, or reset), and capture state — done, triggered,
      START_PTR, CAPTURE_LEN — is untouched by any fill, accepted or refused.
      The sweep guard closes a port-A hazard: a fill accepted mid-sweep wins the
      arbiter and hijacks the sweep's read address, corrupting the CRC.
  - id: REA-REQ-853
    kind: behavioral
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.2 Selftest pattern mode (BIST)" }]
    desc: >-
      An accepted fill sets selftest_mode BEFORE its first pattern write and
      bumps CAPTURE_EPOCH; selftest_mode clears on arm or reset. Reading the
      filled buffer back through the production DATA_BASE/DATA_WORD_SEL path
      is word-exact against the host LFSR reference, and the subsequent
      sweep publishes the pattern's CRC_SAMPLE.
  - id: REA-REQ-854
    kind: negative
    spec: [{ doc: docs/FDD_REA_TRUST_TIER_V08.md, clause: "2.2 Selftest pattern mode (BIST)" }]
    desc: >-
      The timestamp plane is NEVER written by a fill — its din remains the
      free-running counter and its write enable stays low for the entire
      fill (the v0.7 stored-timestamp-equals-counter semantic survives
      selftest).
    formal:
      clock: rising_edge(sample_clk_i)
      # REA-P3.2 (REA-T2.1 finding 3 rebind). The v0.8 trust core was extracted
      # to rr_rea_trust_core; the TIMESTAMP PLANE stays in rr_rea_top's
      # `g_timestamp_plane` generate (outside the extracted core), so this
      # property is a TOP-level ts-plane obligation, not a trust-core one. The
      # generate-nested `ts_we_a` is unresolvable by an external vunit bound to
      # rr_rea_top(rtl) (P2.993 resolution gate). Sound arch-level rebind: the ts
      # plane write is gated by selftest_mode_r (ts_we_a<='0' when ts_owns_a or
      # selftest_mode_r), so during a fill (selftest_mode_r='1') it is low. Full
      # behaviour covered by cocotb (test_rea_timestamp_plane, _crc_ts_plane);
      # a formal binding needs ts_we_a hoisted to an arch-level signal (tracked
      # under RTL-P2.989 REA-leaves-routertl cleanup).
      psl: "always (selftest_mode_r = '1' -> ts_we_a = '0')"

  # ── rr_rea_axi4lite + the external register-bus port (RTL-P3.931) ──
  #
  # WHY THIS FAMILY EXISTS. rr_rea's readback was JTAG-only, so a design that
  # already has a control bus (an IDP-class debug build with AXI4-Lite and no
  # spare BSCAN user chain) could not use it — and hand-rolled a twin instead
  # (rr-idp's gen_dbg_cap, whose CDC is unsynchronised, IDP-P2.11). The fix is
  # NOT a second capture core: rr_rea_jtag_iface already converts the TAP into
  # a plain register bus that rr_rea_regbank speaks, so an alternative BRIDGE
  # onto that same bus reuses the whole silicon-proven datapath.
  #
  # These requirements deliberately constrain the INPUT DOMAIN and state
  # PROHIBITIONS. An output-mapping-only contract ("a read returns the register
  # value") cannot fail against any plausible implementation, and would not have
  # caught the two defects this family exists to prevent: a bridge that ACKs
  # before the regbank's registered read data is valid, and a second bus master
  # driving the reg bus while the first is mid-transaction.

  - id: REA-REQ-900
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "External register-bus port (lean profile)" }]
    desc: >-
      With G_REG_IFACE = "external", rr_rea_top's internal register bus is
      driven by the reg_*_i slave ports and NO rr_rea_jtag_iface is
      instantiated. The regbank, CDC, capture FSM and trust core are
      bit-identical to the JTAG configuration — the interface changes, the
      datapath does not.

  - id: REA-REQ-901
    kind: negative
    spec: [{ doc: SPEC.md, clause: "External register-bus port (lean profile)" }]
    desc: >-
      With G_REG_IFACE = "external" the TAP inputs (tck_i / tdi_i / capture_i /
      shift_en_i / update_i / sel_i) SHALL have no effect on any register, and
      tdo_o SHALL be held low. Toggling the whole TAP through a full
      capture/shift/update sequence must leave every register unchanged — two
      live bus masters on one register bus is the corruption this prohibits.

  - id: REA-REQ-902
    kind: negative
    spec: [{ doc: SPEC.md, clause: "External register-bus port (lean profile)" }]
    desc: >-
      With G_REG_IFACE = "jtag" (the default) the external reg_*_i ports SHALL
      have no effect. An integrator who leaves them dangling, or drives them by
      accident, cannot disturb a JTAG-controlled core — the default
      configuration is byte-identical in behaviour to the pre-P3.931 core.

  - id: REA-REQ-903
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "AXI4-Lite bridge" }]
    desc: >-
      rr_rea_axi4lite presents a compliant AXI4-Lite slave and drives the
      rr_rea register bus. A write transaction asserts reg_wr_en_o for exactly
      ONE cycle with reg_addr_o/reg_wdata_o held stable across it, and a read
      returns the regbank's data for the addressed register.

  - id: REA-REQ-904
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "AXI4-Lite bridge" }]
    desc: >-
      The read response waits for the FULL registered read latency of the
      addressed location before asserting rvalid, so rdata is the addressed
      register's or capture cell's value and never its predecessor's. The
      regbank's rd_data_o is registered (the RTL-P1.96 read-path pipelining)
      — one edge — and the DATA_BASE window is one edge deeper (BRAM
      synchronous read, then the registered paging mux) — two edges. A bridge
      that returns data in the same cycle it presents the address returns
      STALE data, and one that waits only the regbank's edge returns every
      capture cell as the cell addressed BEFORE the read (REA-P2.4 found the
      1.1.0 bridge doing exactly that: the whole window read as physical cell
      0 over AXI). Both are the one-cell-lag class of defect that has cost
      real bring-up time on two vendors; consecutive DATA_BASE reads over the
      bridge must return distinct, correct cells.

  - id: REA-REQ-905
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "AXI4-Lite bridge" }]
    desc: >-
      Full AXI4-Lite handshake independence: the bridge SHALL accept awvalid
      and wvalid in either order, or simultaneously, and complete the write
      only when BOTH have been accepted. A master that presents w before aw
      (legal, and what several interconnects do under backpressure) must not
      hang or write to a stale address.

  - id: REA-REQ-906
    kind: negative
    spec: [{ doc: SPEC.md, clause: "AXI4-Lite bridge" }]
    desc: >-
      The bridge SHALL NOT assert bvalid or rvalid before the corresponding
      transaction has actually been applied to the register bus, and SHALL hold
      each response until its ready is seen. Responses are never dropped when a
      master backpressures bready/rready — a dropped response deadlocks the
      master, which on a debug bus means losing the ability to read out the
      capture that was just taken.

  - id: REA-REQ-907
    kind: negative
    spec: [{ doc: SPEC.md, clause: "AXI4-Lite bridge" }]
    desc: >-
      The bridge SHALL NOT issue a second register-bus operation while a prior
      one is outstanding — one AXI transaction produces exactly one reg-bus
      operation. Back-to-back writes with no idle cycle must not merge, and
      must not double-pulse reg_wr_en_o (a double pulse on a toggle register
      such as CTRL arm_toggle is a SILENT no-op: it arms and immediately
      re-arms, and the capture never starts).

  - id: REA-REQ-908
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Lean profile" }]
    desc: >-
      The lean profile (G_SAMPLE_W = 8, G_DEPTH = 512, G_TRIG_CONDS = 1,
      G_NUM_CHAN = 1, G_NUM_SOURCE = 1, G_TIMESTAMP_W = 0) elaborates and
      captures correctly. It is a CONFIGURATION, not a variant core: the size
      lever is the generic set — the sample buffer is already BRAM-inferred and
      costs no fabric — so no logic may be conditionally deleted to make it fit.

  # ── Dump-path transport contract (REA-P2.4, docs/DUMP_PATH_STRATEGY.md) ──
  #
  # WHY THIS FAMILY EXISTS. JTAG limits dump LATENCY, not capture rate, and
  # the answer to "Ethernet REA?" is trucks for the window after STATUS.done
  # — not a second analyser, a second register map, or a MAC in rr_rea. The
  # whole epic (REA-P2.5 burst RTL, RTL-P2.1133/1134/1135 host transports,
  # REA-ICE.1 UDP) rests on one claim: the SPEC.md 32-bit register map is the
  # protocol and a transport only moves addr/data or a window blob. These
  # requirements pin that claim, name the transports, fix the blob layout and
  # the rotation choice, and say how a burst engine is advertised — BEFORE
  # any host or burst RTL exists, so the seams cannot drift while they are
  # being built. Each is falsifiable at the surface a host reaches: two real
  # cores, one behind the TAP and one behind rr_rea_axi4lite, read the same
  # map (test_rea_dump_path_contract_p2_4).

  - id: REA-REQ-909
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Dump-path transports (REA-P2.4)" }]
    desc: >-
      The transports are named jtag, axi_lite, axi_stream_window and
      udp_window, and the SPEC.md 32-bit register map is the protocol they
      all speak. A register-map transport moves only addr/data words against
      that map: through the "jtag" door and the "external" (axi_lite) door
      VERSION (0x00), STATUS (0x08), DATA_WORD_SEL (0xCC) and the DATA_BASE
      window (0x100 + 4*cell, DEPTH cells) SHALL sit at identical offsets and
      yield identical values, and the metadata registers (SAMPLE_W, DEPTH,
      TIMESTAMP_W, FEATURES) SHALL agree. No transport adds a register, a
      version word, an address offset or a byte/word remap of its own.

  - id: REA-REQ-910
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Dump-path transports (REA-P2.4)" }]
    desc: >-
      v1 ships jtag (existing) and axi_lite; axi_stream_window is v1-adjacent
      RTL (REA-P2.5) and udp_window is Icebox (REA-ICE.1). A core has exactly
      ONE register-bus master, selected by G_REG_IFACE: two live masters on
      one register bus remain forbidden (REA-REQ-901 stands) until the
      dual-door arbiter (REA-P3.4). In particular a "jtag" core's reg_*_i
      ports SHALL NOT act as a second door — a well-formed write on them
      SHALL leave every register unchanged (REA-REQ-902) — and no transport
      may add a MAC, ARP or TCP stack inside rr_rea.

  - id: REA-REQ-911
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Dump-path transports (REA-P2.4)" }]
    desc: >-
      The window blob every window transport carries is headerless and
      plane-major — the whole sample plane, then the whole timestamp plane
      iff FEATURES[18] — with CAPTURE_LEN cells per plane. Each cell is
      ceil(plane_w/32) little-endian 32-bit words, word k = plane bits
      [32k+31:32k], the final partial word zero-padded: byte-for-byte the
      value DATA_BASE returns with DATA_WORD_SEL = k and DATA_PLANE_SEL =
      plane, so one paging rule serves the register-map path and the blob.
      Blob length is CAPTURE_LEN * (ceil(SAMPLE_W/32) + [FEATURES[18]] *
      ceil(TIMESTAMP_W/32)) * 4 bytes. The blob built through the jtag door
      and through the axi_lite door from the same capture SHALL be
      byte-identical (REA-REQ-900: one datapath behind either bridge).

  - id: REA-REQ-912
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Dump-path transports (REA-P2.4)" }]
    desc: >-
      Rotation is ENGINE-SIDE for window transports: blob cell i is physical
      DATA_BASE cell (START_PTR + i) mod DEPTH, so blob index PRETRIG is the
      trigger sample, both planes are time-monotonic across ring wrap, and a
      window consumer performs no host-side rotation. Register-map transports
      (jtag, axi_lite) are unchanged: DATA_BASE is walked by physical address
      and the host rotates from START_PTR (the v0.2 REAClient contract).

  - id: REA-REQ-913
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Dump-path transports (REA-P2.4)" }]
    desc: >-
      A window transport is advertised by a FEATURES bit, never by a VERSION
      bump: FEATURES[20] SHALL read 1 iff an axi_stream_window dump engine is
      elaborated (generic-derived, never hand-set), FEATURES[21] is reserved
      for udp_window, and a core that elaborates no window engine SHALL read
      0 in both bits through every door. A host SHALL NOT select a window
      transport whose bit reads 0. VERSION moves only when the register map
      gains a register or changes a semantic; moving the existing map or the
      blob over a new truck does not bump it (tier byte stays odd,
      REA-REQ-806).

  - id: REA-REQ-914
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Dump-path transports (REA-P2.4)" }]
    desc: >-
      When the axi_stream_window dump engine is elaborated (G_AXIS_WINDOW,
      FEATURES[20]=1), after a capture reaches STATUS.done the engine SHALL
      emit the window blob as one AXI-Stream burst on its m_axis_* master, in
      the frozen layout of REA-REQ-911/912: plane-major (the whole sample
      plane, then the timestamp plane iff FEATURES[18]), CAPTURE_LEN cells per
      plane, cell i = physical DATA_BASE cell (START_PTR + i) mod DEPTH, each
      cell ceil(plane_w/32) little-endian 32-bit beats. The burst SHALL be
      exactly CAPTURE_LEN * (ceil(SAMPLE_W/32) + [FEATURES[18]] *
      ceil(TIMESTAMP_W/32)) beats, carry tlast on and only on the last beat,
      and be BYTE-IDENTICAL to a DATA_BASE walk of the same capture over the
      register door (REA-REQ-911) — so a window consumer performs no host-side
      rotation. tdata and tlast SHALL be held stable while tvalid is asserted
      and tready is low (AXI-Stream back-pressure). Control stays on the
      register map: the engine is a read-only window mover, never a second
      register-bus master (REA-REQ-901 stands).

  - id: REA-REQ-915
    kind: behavioral
    spec: [{ doc: SPEC.md, clause: "Dump-path transports (REA-P2.4)" }]
    desc: >-
      START_PTR and STATUS.done leave the capture FSM on the SAME sample-clock
      edge (REA-REQ-104) and reach the dump engine's register-bus domain over
      SEPARATE rr_rea_sync_word crossings (1-bit done, multi-bit start_ptr) —
      whose contract (REA-REQ-020/021) requires the source stable for ≥2 dest
      clocks around any sample. The engine SHALL NOT snapshot start_ptr on the
      dest edge done first resolves high: it SHALL wait until start_ptr has
      settled (multiple dest cycles after the done edge) before latching the
      window pointer, so a torn or one-cycle-late start_ptr can NEVER rotate
      the emitted burst to the wrong window. Equivalently: for any bounded
      skew between the two crossings, the burst SHALL rotate on the SETTLED
      START_PTR, byte-identical to the DATA_BASE walk that reads the settled
      register (REA-REQ-911/914). A dump that rotated on a stale start_ptr
      while the register walk read the settled one is a defect, not a race the
      host can tolerate.

  - id: REA-REQ-916
    kind: negative
    spec: [{ doc: SPEC.md, clause: "Dump-path transports (REA-P2.4)" }]
    desc: >-
      The dump engine and the register-map DATA_BASE decode share the one DPRAM
      read port (port B) through a local arbiter, and while bursting the engine
      owns it. A DATA_BASE read issued between STATUS.done and the burst's tlast
      therefore returns the cell the engine is walking, not the addressed cell —
      silently, with no wait or error. DATA_BASE is UNDEFINED while a dump is in
      progress: the host SHALL NOT walk DATA_BASE while a window dump is in
      flight — it either consumes the window over the m_axis_* transport it
      selected, or waits for tlast (one-shot per STATUS.done) before reading
      DATA_BASE over the register door. This binds most in the jtag door, where
      reg_clk_o is TCK and m_axis_tready_i defaults 1, so a G_AXIS_WINDOW build
      begins dumping at TCK on done and can overlap an rr ila DATA_BASE walk.
      Giving the register decode arbiter priority is NOT a substitute — it would
      steal the engine's own mid-cell read and corrupt the burst; the contract
      is one consumer of the window at a time. A busy/dump-in-progress status
      bit would be a register-map semantic addition (a VERSION bump, REA-REQ-806/
      913) and is deferred with the dual-door arbiter (REA-P3.4).
