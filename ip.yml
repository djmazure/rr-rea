# rr_rea - RouteRTL Embedded Analyzer (REA)
# On-chip protocol tier v0.11 (VERSION magic 0x5245410B): storage qualification
# (REA-P2.7) on top of the aligned per-sample timestamp plane (DATA_PLANE_SEL,
# RTL-T2.123), the v0.8 readback-integrity trust tier and PRETRIG_VALID.
#
# First-party on-chip logic analyzer IP. THIS repo (github.com/djmazure/rr-rea)
# is the PUBLIC home of the routertl/rea package: `rr pkg publish` runs from
# here, the registry pins this repo's commits, and `rr pkg add routertl/rea`
# clones it anonymously.
#
# THREE INDEPENDENT VERSION SURFACES — they do NOT have to agree, and briefly
# agreeing on 0.9.0 (RTL-P2.1106) was a coincidence of values, not a contract:
#
#   version: below        the PACKAGE version the registry pins   -> 1.4.2
#   rea_regbank.yml       the REGISTER MAP version                -> 0.11.0
#   C_REA_VERSION         the on-chip RUNTIME FEATURE TIER        -> 0x5245410B
#
# 1.4.2 (REA-P2.11) is a PATCH: the capture FSM's window-full flag is a
# register kept in step with post_count, and its arm-time threshold is taken
# straight from POSTTRIG. The window-full compare was the Fmax limiter of
# every configuration; routed OOC xc7z020-1 now 241 / 214 / 219 MHz for
# util_min / util_default / util_field_noqual (was 217 / 179 / 182). No
# behaviour change: bit-exact against the frozen reference (lockstep).
#
# 1.4.1 (REA-T2.5) is a PATCH: PRETRIG_VALID is carried down the trigger
# pipeline instead of recomputed as since_arm - fire_lag at the fire edge.
# That chain survived in every build after REA-T2.4 and capped Fmax at
# 136-156 MHz (xc7z020-1). Near DEPTH the value now never covers a cell the
# ring overwrote (REA-REQ-963); the old FSM trusted one or two of them.
#
# 1.4.0 (REA-P2.8) is a MINOR bump: the package now SHIPS timing constraints
# (build.sources.xdc -> constraints/rr_rea_scoped.xdc, applied read_xdc -ref
# rr_rea_top). They declare the BSCANE2 TCK clock, which was absent, leaving
# the JTAG domain untimed, and bound every tck <-> sample crossing with
# set_max_delay -datapath_only at half the faster period. A consumer's
# build now times paths it previously ignored, so a design that "met
# timing" may now show real JTAG-domain or crossing violations.
#
# 1.3.2 (REA-P2.10) is a PATCH: every signal crossed between the register
# clock and sample_clk_i now leaves its domain from a flop (REA-REQ-961).
# The COND/QUAL slot expansion is registered in the register domain and
# selftest_busy in the sample domain. Before this, report_cdc showed 17 x
# CDC-10 (combinational logic before a synchronizer). One clock of latency
# on quasi-static/status words; no port, generic, register or VERSION
# change. The CDC constraint guidance is now bounded datapath, never an async
# clock group.
#
# 1.3.1 (REA-T2.4) is a PATCH: a decimated capture (DECIM > 0) no longer
# stops one stored cell short when the trigger fires between decimation ticks
# (the host read a stale cell from an earlier capture as the last sample), and
# PRETRIG_VALID counts stored samples exactly under decimation (REA-REQ-960).
# No port, generic, register or VERSION change; DECIM = 0 captures are
# unchanged.
#
# 1.3.0 (REA-P2.7) is a MINOR bump: storage qualification. rr_rea_top gains an
# OPTIONAL generic G_QUAL_CONDS (default 0 = no qualifier, the v0.9 analyzer
# bit for bit — REA-REQ-950) and the capture FSM stores a sample only when a
# qualifier built from comparator-array slots holds, so a 4096-deep window
# holds 4096 bus events over seconds instead of 82 us of idle cycles. The
# register map GAINS QUAL_MODE/SEL/CFG/VAL (0xB4..0xC0) and FEATURES[22]/
# [27:24], so VERSION moves to the next odd tier 0x5245410B (REA-REQ-913/806).
# G_QUAL_CONDS > 0 requires G_TIMESTAMP_W > 0 (elaboration fails otherwise).
# No existing port or generic changes; existing instantiations are untouched.
#
# 1.2.0 (REA-P2.5) is a MINOR bump: rr_rea_top gains an OPTIONAL AXI-Stream
# window-dump engine (rr_rea_axis_window, generic G_AXIS_WINDOW defaulting to
# false) plus the m_axis_* master ports. After STATUS.done it bursts the frozen
# window blob (plane-major, engine-rotated, tlast on the last beat) that a host
# otherwise walks from DATA_BASE — proven byte-identical in
# test_rea_axis_window_dump_p2_5. Advertised by FEATURES[20]. Existing builds
# are untouched: the generic defaults off (no engine, inert master), the new
# ports have defaults, and neither the register map nor the VERSION magic moves
# (a transport does not bump VERSION — REA-REQ-913). Control stays on the
# register door; the engine is a read-only window mover, never a second master.
#
# 1.1.1 (REA-P2.4) is a PATCH: rr_rea_axi4lite waited only the regbank's one
# registered-read edge, but a DATA_BASE capture cell is two edges behind the
# address (BRAM read + registered paging mux), so every window read over AXI
# returned the cell addressed BEFORE the read (physical cell 0 for the whole
# window). Found by the dump-path contract test reading the same capture
# through the JTAG and AXI doors; fixed with one extra read wait state. No
# port, generic or register-map change; VERSION magic unchanged.
#
# 1.1.0 (RTL-P3.931) is a MINOR bump: rr_rea_top gains an OPTIONAL external
# register-bus interface (G_REG_IFACE, defaulting to "jtag") plus the
# rr_rea_axi4lite bridge, so a design with a control bus and no spare BSCAN
# user chain can use REA instead of hand-rolling a capture block. Every
# existing instantiation is untouched — new generic has a default, new ports
# have defaults, and the "jtag" path is the same silicon it was.
#
# 1.0.0 was a MAJOR bump because the ESA _i/_o rename changed rr_rea_top's
# public entity ports (sample_clk->sample_clk_i, probe_in->probe_i,
# source_out->source_o) — a breaking interface change for every consumer.
# It also ends RTL-T2.228, where this tree and the routertl vendored builtin
# both claimed 0.9.0 with incompatible ports, making an ip.lock pin of
# "0.9.0" meaningless.
#
# The other two surfaces deliberately do NOT move with it: the register map
# is unchanged by a port rename, and the feature tier is unchanged because no
# runtime feature was added. NB the tier byte must stay ODD — the
# readback-trust acceptance probe keys on bit0=1 — so it can never simply
# track a decimal package version.

name: rea
namespace: routertl
version: 1.4.2
description: RouteRTL Embedded Analyzer JTAG logic analyzer IP.
license: MIT
library: rr_rea
language: vhdl

hdl:
  library: rr_rea
  language: vhdl
  top_module: rr_rea_top
  top_sim: rr_rea_capture_fsm
  files:
    - rtl/rr_rea_pkg.vhd
    # NB rr_rea_build_id_pkg is NOT shipped — it is a build-flow-GENERATED input
    # (RTL-T2.119). A consuming project regenerates it (rr_rea_build_id pre_build
    # hook) with a real REA source hash and lists its OWN generated copy. See
    # SPEC.md "Identity / content fingerprint". Standalone sim/lint use the
    # fixture at sim/cocotb/tests/rea/fixtures/rr_rea_build_id_stub.vhd.
    - rtl/rr_rea_dpram.vhd
    - rtl/rr_rea_capture_fsm.vhd
    - rtl/rr_rea_regbank.vhd
    - rtl/rr_rea_cdc.vhd
    - rtl/rr_rea_jtag_iface.vhd
    - rtl/rr_rea_fill_fsm.vhd
    - rtl/rr_rea_crc_sweep.vhd
    - rtl/rr_rea_trust_core.vhd
    - rtl/rr_rea_axi4lite.vhd
    - rtl/rr_rea_axis_window.vhd
    - rtl/rr_rea_top.vhd
    - rtl/rr_rea_trig_xbar.vhd

paths:
  sources: rtl

synthesis:
  mode: rtl
  sources:
    - rtl/rr_rea_pkg.vhd
    # NB rr_rea_build_id_pkg is NOT shipped — it is a build-flow-GENERATED input
    # (RTL-T2.119). A consuming project regenerates it (rr_rea_build_id pre_build
    # hook) with a real REA source hash and lists its OWN generated copy. See
    # SPEC.md "Identity / content fingerprint". Standalone sim/lint use the
    # fixture at sim/cocotb/tests/rea/fixtures/rr_rea_build_id_stub.vhd.
    - rtl/rr_rea_dpram.vhd
    - rtl/rr_rea_capture_fsm.vhd
    - rtl/rr_rea_regbank.vhd
    - rtl/rr_rea_cdc.vhd
    - rtl/rr_rea_jtag_iface.vhd
    - rtl/rr_rea_fill_fsm.vhd
    - rtl/rr_rea_crc_sweep.vhd
    - rtl/rr_rea_trust_core.vhd
    - rtl/rr_rea_axi4lite.vhd
    - rtl/rr_rea_axis_window.vhd
    - rtl/rr_rea_top.vhd
    - rtl/rr_rea_trig_xbar.vhd
  sources_per_vendor:
    xilinx:
      - rtl/rr_rea_jtag_xilinx7.vhd
    altera:
      - rtl/rr_rea_jtag_intel.vhd

build:
  # REA-P2.8: REA's own timing constraints, shipped to every consumer. rr
  # vendors build.sources.xdc into the consumer's ip.lock scoped_constraints
  # (RTL-P2.636) and applies it as `read_xdc -ref rr_rea_top` (ref =
  # hdl.top_module), so every get_* resolves against the REA instance
  # wherever the consumer puts it. The consumer adds no timing XDC. It
  # declares the BSCANE2 TCK clock (Vivado does not derive one, which left
  # the whole JTAG domain untimed) and bounds each tck <-> sample crossing
  # with set_max_delay -datapath_only at half the faster period, derived
  # from the live sample clock. No async clock group (SPEC "Clock-domain
  # crossings").
  sources:
    xdc:
      - constraints/rr_rea_scoped.xdc
  simulation:
    sources: []
    test_dir: sim/cocotb/tests
    simulator: nvc
    # RTL-T3.98 unit source closure. `rr sim` standalone against a single unit
    # must elaborate ONLY that unit's source closure, not the whole IP — a
    # capture-FSM test that drags in the top, the regbank and the JTAG iface
    # is slower and stops being a unit test.
    #
    # RTL-P2.989: this block lived ONLY in the routertl vendored builtin and
    # was never mirrored here, so evicting the builtin would have deleted the
    # capability outright. It is restored to the canonical tree with the
    # in-repo test_dir above (the builtin's escaped the IP root as
    # ../../../sim/cocotb/tests/rea — the non-self-contained shape RTL-P4.239
    # was filed for).
    tests:
      test_rea_capture_fsm:
        top: rr_rea_capture_fsm
        sources:
          - rtl/rr_rea_pkg.vhd
          - rtl/rr_rea_capture_fsm.vhd
        generics:
          G_SAMPLE_W: 12
          G_DEPTH: 4096
    waves:
      formats: [fst]

  # RTL-P3.415: ip.yml-declared generation hook. REA deliberately does NOT ship
  # rr_rea_build_id_pkg.vhd — it is a build-flow-GENERATED source-hash package
  # (RTL-T2.119). A consumer that installs REA via `rr pkg add routertl/rea`
  # gets this hook recorded in ip.lock; the consumer's build runs it (no manual
  # project.yml wiring) to write generated/rr_rea_build_id_pkg.vhd, and the
  # `outputs[].library` places that file into library rr_rea (where the regbank's
  # `use work.rr_rea_build_id_pkg` resolves). ${pkg_root} is substituted to the
  # IP's installed root at install time; ${generated_dir} → the consumer's
  # generated/ dir at hook-execution time.
  hooks:
    pre_build:
      - name: rr_rea_build_id
        script: routertl:sdk/scripts/rr_rea_build_id.py
        args:
          # RTL-P3.1213: hash the DECLARED hdl file list, not a directory
          # glob — every install flavor (demo tree / builtin / --local)
          # reports the SAME BUILD_ID for the same release.
          - "--ip-yml"
          - "${pkg_root}/ip.yml"
          - "--out"
          - "${generated_dir}/rr_rea_build_id_pkg.vhd"
        watch:
          - "${pkg_root}/rtl/*.vhd"
          - "${pkg_root}/ip.yml"
        # Publish-LINT stub for the generated-only package — LINT-ONLY, never a
        # consumer synth source (RTL-T2.119 stub-collision guard).
        lint_stub: verif/rr_rea_build_id_stub.vhd
        outputs:
          - path: "${generated_dir}/rr_rea_build_id_pkg.vhd"
            library: rr_rea

requirements: requirements.yml
# Register bank association (RTL-P3.1312): REA's bank is `rea_regbank.yml`, not
# the conventional `project_regbank.yml`. This manifest-owned pointer (mirroring
# `requirements:`) lets `rr fdd` and any regbank consumer find it. `rr fdd`
# digest-covers the pointed file, so an edit to it marks the FDD stale.
regbank: rea_regbank.yml

ips: []
